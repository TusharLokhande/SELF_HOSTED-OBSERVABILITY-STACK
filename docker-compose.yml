services:

  # ============================================================
  # GRAFANA
  # ============================================================

  grafana:
    image: grafana/grafana:13.2
    container_name: observability-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}

      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - observability
      - proxy

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.grafana.rule=Host(`grafana.tushar.sbs`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.docker.network=proxy"

      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

    depends_on:
      - prometheus
      - loki
      - tempo


  # ============================================================
  # PROMETHEUS
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: observability-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - observability

    depends_on:
      - otel-collector
      - node-exporter
      - cadvisor


  # ============================================================
  # LOKI
  # ============================================================

  loki:
    image: grafana/loki:3.7.0
    container_name: observability-loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/loki.yml"

    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

    networks:
      - observability


  # ============================================================
  # TEMPO
  # ============================================================

  tempo:
    image: grafana/tempo:latest
    container_name: observability-tempo
    restart: unless-stopped

    command:
      - "-config.file=/etc/tempo/tempo.yml"

    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

    networks:
      - observability


  # ============================================================
  # OPENTELEMETRY COLLECTOR
  # ============================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: observability-otel
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol-contrib/otel-collector.yml"

    volumes:
      - ./otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro

      # Docker container logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

    networks:
      - observability

    depends_on:
      - loki
      - tempo


  # ============================================================
  # NODE EXPORTER
  # Fedora HOST metrics
  # ============================================================

  node-exporter:
    image: prom/node-exporter:latest
    container_name: observability-node-exporter
    restart: unless-stopped

    command:
      - "--path.rootfs=/host"

    volumes:
      - "/:/host:ro,rslave"

    networks:
      - observability


  # ============================================================
  # CADVISOR
  # Docker CONTAINER metrics
  # ============================================================

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: observability-cadvisor
    restart: unless-stopped

    privileged: true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - observability


networks:

  observability:
    external: true

  proxy:
    external: true


volumes:

  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data: